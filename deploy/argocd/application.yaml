apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/saisushaman/gitops-cicd-pipeline.git
    targetRevision: main
    path: deploy/base
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Continuously reconcile the cluster to Git, prune removed resources, and
    # revert manual drift (self-heal). This is the core GitOps behaviour.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
