name: CI/CD

on:
  push:
    branches: [main]
    # The manifest-bump commit (below) only touches deploy/**, so ignoring it
    # here prevents an infinite build loop. Human deploy/** edits are reconciled
    # by Argo CD, not by rebuilding the image.
    paths-ignore:
      - 'deploy/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run tests
        run: pytest

  build-and-push:
    name: build · push GHCR · bump manifest
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # push the GitOps manifest bump
      packages: write    # push the image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token that can push the bump commit back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kustomize
        run: |
          VER=5.4.3
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VER}/kustomize_v${VER}_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Bump image tag in manifests (GitOps trigger)
        run: |
          cd deploy/base
          kustomize edit set image ${IMAGE}=${IMAGE}:${{ steps.meta.outputs.sha }}
          cd -
          if git diff --quiet -- deploy/base/kustomization.yaml; then
            echo "No manifest change; skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/base/kustomization.yaml
          git commit -m "chore(deploy): roll image to ${{ steps.meta.outputs.sha }} [skip ci]"
          git push origin HEAD:main
